version: '3.8'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Pass123
    ports:
      - "1433:1433"
    networks:
      - devices-network

  api:
    build:
      context: .
      dockerfile: src/Devices.Api/Dockerfile
    container_name: devices-api
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DevicesDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
    ports:
      - "5000:80"
    networks:
      - devices-network

networks:
  devices-network: