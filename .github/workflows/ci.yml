name: CI Build Test and Create PR via GH CLI

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Devices.Api.slnx

      - name: Check code formatting
        run: dotnet format Devices.Api.slnx --verify-no-changes

      - name: Build
        run: dotnet build Devices.Api.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test Devices.UnitTest/Devices.UnitTest.csproj --no-build --configuration Release --verbosity normal --logger trx

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  create-pr:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Debug branch info
        run: |
          echo "GITHUB_REF: $GITHUB_REF"
          echo "ref_name: ${{ github.ref_name }}"
          echo "actor: ${{ github.actor }}"
          git branch -a
          git rev-parse --abbrev-ref HEAD || true
          git ls-remote --heads origin

      - name: Setup GitHub CLI
        uses: cli/gh-action@v3
        with:
          token: ${{ secrets.GH_TOKEN }}    # use PAT here if needed (see notes)

      - name: Ensure git user configured
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Pull Request using gh CLI
        run: |
          # compute head: if actor is repo owner use branch, otherwise use owner:branch (fork case)
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          REPO_OWNER="${{ github.repository_owner }}"
          ACTOR="${{ github.actor }}"

          if [ "$REPO_OWNER" = "$ACTOR" ]; then
            HEAD_REF="$BRANCH_NAME"
          else
            HEAD_REF="$ACTOR:$BRANCH_NAME"
          fi

          echo "Creating PR from $HEAD_REF to $BASE_BRANCH"
          gh pr create \
            --title "feat: auto PR from $BRANCH_NAME to $BASE_BRANCH" \
            --body "Automated PR created by CI after successful build and tests." \
            --base "$BASE_BRANCH" \
            --head "$HEAD_REF" \
            --label "auto-pr" \
            --assignee "$ACTOR" || echo "gh pr create returned non-zero (maybe PR already exists)"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
